<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{css}}">
<title>Solder</title>
</head>
<body>
<header class="bar">
  <svg class="brand" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.3 5.5H9.6L7.4 7.7v1.8l2.2 2.2h4.6l2.2 2.2v1.6l-2.2 2.2H7.7"/><circle class="hollow" cx="16.4" cy="5.5" r="1.7"/><circle cx="7.6" cy="17.7" r="1.9"/></svg>
  <button id="chat-title" class="title" title="Your chats" aria-haspopup="menu" aria-expanded="false"><span id="chat-title-text">New chat</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></button>
  <div class="bar-actions">
    <button id="btn-new" class="icon" title="New chat" aria-label="New chat"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="btn-more" class="icon" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12.5" cy="8" r="1"/></svg></button>
  </div>
  <div id="chat-menu" class="menu hidden" role="menu" aria-label="Your chats"></div>
  <div id="chat-actions" class="menu ctx hidden" role="menu" aria-label="Chat actions"></div>
  <div id="more-menu" class="menu right hidden" role="menu" aria-label="More">
    <button role="menuitem" tabindex="-1" data-action="rename">Rename this chat…</button>
    <button role="menuitem" tabindex="-1" data-action="delete">Delete this chat</button>
    <button role="menuitem" tabindex="-1" data-action="refreshModels">Refresh models</button>
    <button role="menuitem" tabindex="-1" data-action="setKey">Set API key…</button>
    <button role="menuitem" tabindex="-1" data-action="settings">Settings</button>
    <div class="sep" role="separator"></div>
    <button role="menuitem" tabindex="-1" data-setup="start">Guided setup…</button>
    <button role="menuitem" tabindex="-1" data-action="guide">Guide</button>
    <button role="menuitem" tabindex="-1" data-action="feedback">Send feedback…</button>
    <button role="menuitem" tabindex="-1" data-action="diagnostics">Copy diagnostics</button>
  </div>
</header>

<main id="transcript" role="log" aria-live="off" aria-label="Chat"></main>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>

<section id="composer" aria-label="Message">
  <button id="to-bottom" class="to-bottom hidden" title="Scroll to bottom" aria-label="Scroll to bottom"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v8.5M4.5 8.5 8 12l3.5-3.5"/></svg></button>
  <div id="plan-dock" class="plan-dock hidden" aria-label="Plan, while it works"></div>
  <div id="approvals"></div>
  <div id="banner" class="banner hidden" role="alert"></div>
  <div class="box">
    <div id="slash" class="slash hidden" role="listbox" aria-label="Commands"></div>
    <div id="chips" class="chips"></div>
    <textarea id="input" rows="1" placeholder="Ask Solder to read or change your code…" aria-label="Message" aria-autocomplete="list" aria-controls="slash"></textarea>
    <div class="row">
      <div id="model" class="model">
        <button id="model-button" class="model-button" title="Model" aria-haspopup="menu" aria-expanded="false" aria-labelledby="model-label model-name"><span id="model-name">Model</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></button>
        <span id="model-label" hidden>Model:</span>
        <div id="model-menu" class="menu up hidden" role="menu" aria-label="Model"></div>
      </div>
      <div id="effort" class="effort" title="How hard the model thinks" role="group" aria-label="Effort">
        <button data-level="low" class="active" aria-pressed="true" aria-describedby="tip-low" data-tip="Quick answers. The default.">Low</button>
        <button data-level="medium" aria-pressed="false" aria-describedby="tip-medium" data-tip="More thought, a little slower.">Medium</button>
        <button data-level="high" aria-pressed="false" aria-describedby="tip-high" data-tip="Consumes significantly more usage and will take longer to answer.">High</button>
      </div>
      <span id="tip-low" hidden>Quick answers. The default.</span><span id="tip-medium" hidden>More thought, a little slower.</span><span id="tip-high" hidden>Consumes significantly more usage and will take longer to answer.</span>
      <span class="grow"></span>
      <button id="send" class="send" title="Send (Enter)" aria-label="Send"><svg viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg></button>
      <button id="stop" class="send stop hidden" title="Stop (Esc)" aria-label="Stop"><svg viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1"/></svg></button>
    </div>
  </div>
  <div id="footer" class="footer"></div>
</section>
<script nonce="{{nonce}}" src="{{js}}"></script>
</body>
</html>
