# Publishes a GitHub release's .vsix to the VS Code Marketplace, with Trusted Publishing (no stored token).
#
# Runs when a release is published (or by hand, for a tag). It uses nothing but the runner's own gh, curl and jq:
# no actions from anyone else, no npm, no vsce. The requests are the ones vsce makes for `vsce publish --oidc`:
#   1. GitHub Actions gives this job an OIDC token for the audience marketplace.visualstudio.com;
#   2. the Marketplace exchanges it (POST _apis/gallery/token) for a credential that lasts 15 minutes;
#   3. the package is uploaded with it (PUT _apis/gallery/publishers/gremnar/extensions/solder).
#
# The Marketplace accepts the exchange only for a Trusted Publishing policy on the gremnar publisher
# (marketplace.visualstudio.com/manage → gremnar → Trusted Publishing) naming this repository and this workflow
# file, marketplace.yml. See CONTRIBUTING.md.
name: Publish to the Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, such as v0.1.4"
        required: true

permissions:
  contents: read
  id-token: write # the OIDC token the Marketplace exchanges

concurrency:
  group: marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the release's .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "solder-*.vsix" --dir out
          file=$(ls out/solder-*.vsix)
          # The package's version must be the tag's: v0.1.4 publishes solder-0.1.4.vsix, nothing else.
          if [ "$(basename "$file")" != "solder-${TAG#v}.vsix" ]; then
            echo "::error::The release $TAG holds $(basename "$file"), not solder-${TAG#v}.vsix."
            exit 1
          fi
          echo "FILE=$file" >> "$GITHUB_ENV"
          ls -l "$file"

      - name: Get a Marketplace credential (Trusted Publishing)
        run: |
          set -euo pipefail
          oidc=$(curl --silent --show-error --fail-with-body --max-time 60 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --header "Accept: application/json" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" | jq -r '.value // empty')
          if [ -z "$oidc" ]; then echo "::error::GitHub gave no OIDC token (the job needs id-token: write)."; exit 1; fi
          echo "::add-mask::$oidc"
          status=$(curl --silent --show-error --max-time 60 --output exchange.json --write-out "%{http_code}" \
            --request POST --header "Authorization: FederatedToken $oidc" \
            --header "Content-Type: application/json" --header "Accept: application/json" --header "User-Agent: vsce" \
            --data '{"publisherName":"gremnar"}' \
            "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1")
          credential=$(jq -r '.credential // empty' exchange.json 2>/dev/null || true)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || [ -z "$credential" ]; then
            echo "::error::The Marketplace refused the exchange (HTTP $status). Is there a Trusted Publishing policy for this repository and marketplace.yml?"
            jq -r '.message // .error_description // .error // empty' exchange.json 2>/dev/null | head -c 1000 || true
            exit 1
          fi
          echo "::add-mask::$credential"
          echo "MARKETPLACE_CREDENTIAL=$credential" >> "$GITHUB_ENV"
          rm -f exchange.json

      - name: Upload it to the Marketplace
        run: |
          set -euo pipefail
          version="7.2-preview.2"
          status=$(curl --silent --show-error --max-time 300 --output response.json --write-out "%{http_code}" \
            --request PUT --user "OAuth:$MARKETPLACE_CREDENTIAL" \
            --header "Content-Type: application/octet-stream" \
            --header "Accept: application/json;api-version=$version" \
            --header "X-Market-CI-Provider: github-actions" \
            --data-binary "@$FILE" \
            "https://marketplace.visualstudio.com/_apis/gallery/publishers/gremnar/extensions/solder?api-version=$version")
          echo "The Marketplace answered HTTP $status."
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            # Its message says why (such as a version that's already there).
            jq -r '.message // empty' response.json 2>/dev/null | head -c 2000 || head -c 2000 response.json
            echo
            exit 1
          fi
          echo "Published $(basename "$FILE"). The Marketplace verifies it before it's live, usually within minutes."
